name: Draft PDF
on: [push]

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: docs/paper.md

      - name: Upload JOSS PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: docs/paper.pdf

      - name: Build arXiv LaTeX source
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -u "$(id -u):$(id -g)" \
            -e JOURNAL=joss \
            openjournals/inara \
            -o preprint \
            docs/paper.md

      - name: Upload arXiv source
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-source
          path: |
            docs/paper.preprint.tex
            docs/*.bib
            docs/*.png
            docs/*.jpg
            docs/*.jpeg
            docs/*.pdf